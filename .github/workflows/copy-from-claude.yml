name: One-time exact copy from Claude

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/copy-from-claude.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned Claude source snapshot
        uses: actions/checkout@v4
        with:
          repository: ThisismynameNOT/Claude
          ref: f5bc8cb53c04583d19e694cffedea46d545b4bac
          path: _source
          fetch-depth: 1

      - name: Copy all source content except workflow files
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_COPY="$RUNNER_TEMP/claude-source"
          rm -rf "$SOURCE_COPY"
          mkdir -p "$SOURCE_COPY"
          cp -a _source/. "$SOURCE_COPY/"
          rm -rf "$SOURCE_COPY/.git" _source

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' "$SOURCE_COPY/" ./

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'Non-workflow content already matches the source snapshot.'
            exit 0
          fi

          git commit -m 'Copy Claude repository content except workflows [skip ci]'
          git push origin HEAD:main
