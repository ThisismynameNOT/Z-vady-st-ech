name: Typography Performance Control

on:
  workflow_dispatch:
  push:
    branches: [fix/czech-typography-rendering]

permissions:
  contents: read

jobs:
  source-and-red:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project and browser QA tools
        run: |
          npm ci --no-audit --no-fund
          rm -rf /tmp/font-qa && mkdir -p /tmp/font-qa && cd /tmp/font-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.55.0
          ln -s /tmp/font-qa/node_modules "$GITHUB_WORKSPACE/.github/qa/node_modules"
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Verify existing faces match pinned Fontsource 5.3.0 inputs
        run: |
          rm -rf /tmp/fontsource && mkdir -p /tmp/fontsource && cd /tmp/fontsource
          npm init -y >/dev/null
          npm install --no-audit --no-fund @fontsource/inter@5.3.0 @fontsource/cormorant-garamond@5.3.0
          cd "$GITHUB_WORKSPACE"
          python <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path('public/assets/fonts')
          pkg = Path('/tmp/fontsource/node_modules')
          checks = [
              ('inter-400.woff2', pkg/'@fontsource/inter/files/inter-latin-400-normal.woff2'),
              ('inter-500.woff2', pkg/'@fontsource/inter/files/inter-latin-500-normal.woff2'),
              ('inter-600.woff2', pkg/'@fontsource/inter/files/inter-latin-600-normal.woff2'),
              ('cormorant-garamond-400.woff2', pkg/'@fontsource/cormorant-garamond/files/cormorant-garamond-latin-400-normal.woff2'),
              ('cormorant-garamond-500.woff2', pkg/'@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-normal.woff2'),
              ('cormorant-garamond-600.woff2', pkg/'@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff2'),
              ('cormorant-garamond-400-italic.woff2', pkg/'@fontsource/cormorant-garamond/files/cormorant-garamond-latin-400-italic.woff2'),
              ('inter-400-latin-ext.woff2', pkg/'@fontsource/inter/files/inter-latin-ext-400-normal.woff2'),
              ('inter-500-latin-ext.woff2', pkg/'@fontsource/inter/files/inter-latin-ext-500-normal.woff2'),
              ('inter-600-latin-ext.woff2', pkg/'@fontsource/inter/files/inter-latin-ext-600-normal.woff2'),
              ('cormorant-garamond-400-latin-ext.woff2', pkg/'@fontsource/cormorant-garamond/files/cormorant-garamond-latin-ext-400-normal.woff2'),
              ('cormorant-garamond-500-latin-ext.woff2', pkg/'@fontsource/cormorant-garamond/files/cormorant-garamond-latin-ext-500-normal.woff2'),
              ('cormorant-garamond-600-latin-ext.woff2', pkg/'@fontsource/cormorant-garamond/files/cormorant-garamond-latin-ext-600-normal.woff2'),
              ('cormorant-garamond-400-italic-latin-ext.woff2', pkg/'@fontsource/cormorant-garamond/files/cormorant-garamond-latin-ext-400-italic.woff2'),
          ]
          failed = []
          for repo_name, source in checks:
              repo = root/repo_name
              rh = sha256(repo.read_bytes()).hexdigest()
              sh = sha256(source.read_bytes()).hexdigest()
              same = rh == sh
              print(f'SOURCE MATCH {repo_name}: {same} repo={rh} pinned={sh}')
              if not same: failed.append(repo_name)
          if failed:
              print('SOURCE COMPATIBILITY: FAIL', ', '.join(failed))
              raise SystemExit(1)
          print('SOURCE COMPATIBILITY: PASS — all 14 Latin and Latin-Extended assets are exact Fontsource 5.3.0 package files')
          PY
      - name: Build current duplicate-resource candidate
        run: npm run build:local
      - name: Start current candidate Worker
        run: |
          npx -y wrangler@4.128.0 dev --local --port 8788 > /tmp/font-red-worker.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/font-red-worker.log
          exit 1
      - name: Prove duplicate-resource regression is RED
        id: red
        continue-on-error: true
        env:
          FONT_QA_BASE_URL: http://127.0.0.1:8788
        run: node .github/qa/font-resource-dedup-test.mjs
      - name: Enforce expected RED result
        run: |
          echo "dedup_test=${{ steps.red.outcome }}"
          test "${{ steps.red.outcome }}" = failure
          test -f font-resource-dedup.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('font-resource-dedup.json'));
          console.log(JSON.stringify({fontResourceCount:r.fontResourceCount,mapped:r.mappedFontResourceCount,duplicates:r.duplicates}, null, 2));
          if (!r.hasLatin || !r.hasCzech || r.duplicates.length === 0) process.exit(1);
          EOF
      - name: Upload RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-resource-dedup-red
          path: |
            font-resource-dedup.json
            /tmp/font-red-worker.log
