name: Typography Performance Control

on:
  workflow_dispatch:
  push:
    branches: [fix/czech-typography-rendering]

permissions:
  contents: read

jobs:
  slim-complete-faces:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout merge-base control
        uses: actions/checkout@v4
        with:
          ref: 1cc9ca6f89242b3ac31ee4e848ebad1bec1ecf32
          path: baseline
      - name: Checkout typography candidate
        uses: actions/checkout@v4
        with:
          ref: d7b5fde10e1923225c33d0c7bddef62d3b49de9b
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned source packages and QA tools
        run: |
          python -m pip install --disable-pip-version-check --quiet fonttools brotli
          python -m pip show fonttools brotli
          rm -rf /tmp/fontsource && mkdir -p /tmp/fontsource && cd /tmp/fontsource
          npm init -y >/dev/null
          npm install --no-audit --no-fund @fontsource/inter@5.3.0 @fontsource/cormorant-garamond@5.3.0
          cd "$GITHUB_WORKSPACE"
          (cd baseline && npm ci --no-audit --no-fund)
          (cd candidate && npm ci --no-audit --no-fund)
          rm -rf /tmp/typo-test && mkdir -p /tmp/typo-test && cd /tmp/typo-test
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.55.0 pngjs@7.0.0 lighthouse@12.8.2
          ln -s /tmp/typo-test/node_modules "$GITHUB_WORKSPACE/candidate/.github/qa/node_modules"
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Build slim Czech-complete resources in existing face URLs
        run: |
          python <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          from fontTools.subset import Options, Subsetter
          from fontTools.merge import Merger

          target = 'ŘřŮůĚěŠšČčŽžÝýÁáÍíÉéÓóĎďŤťŇň'
          codepoints = {ord(ch) for ch in target}
          pkg = Path('/tmp/fontsource/node_modules')
          out = Path('candidate/public/assets/fonts')
          faces = [
              ('inter-400.woff2', pkg/'@fontsource/inter/files/inter-latin-400-normal.woff2', pkg/'@fontsource/inter/files/inter-latin-ext-400-normal.woff2'),
              ('inter-500.woff2', pkg/'@fontsource/inter/files/inter-latin-500-normal.woff2', pkg/'@fontsource/inter/files/inter-latin-ext-500-normal.woff2'),
              ('inter-600.woff2', pkg/'@fontsource/inter/files/inter-latin-600-normal.woff2', pkg/'@fontsource/inter/files/inter-latin-ext-600-normal.woff2'),
              ('cormorant-garamond-400.woff2', pkg/'@fontsource/cormorant-garamond/files/cormorant-garamond-latin-400-normal.woff2', pkg/'@fontsource/cormorant-garamond/files/cormorant-garamond-latin-ext-400-normal.woff2'),
              ('cormorant-garamond-500.woff2', pkg/'@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-normal.woff2', pkg/'@fontsource/cormorant-garamond/files/cormorant-garamond-latin-ext-500-normal.woff2'),
              ('cormorant-garamond-600.woff2', pkg/'@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff2', pkg/'@fontsource/cormorant-garamond/files/cormorant-garamond-latin-ext-600-normal.woff2'),
              ('cormorant-garamond-400-italic.woff2', pkg/'@fontsource/cormorant-garamond/files/cormorant-garamond-latin-400-italic.woff2', pkg/'@fontsource/cormorant-garamond/files/cormorant-garamond-latin-ext-400-italic.woff2'),
          ]

          def cmap(path):
              font = TTFont(path)
              values = set()
              for table in font['cmap'].tables:
                  if table.isUnicode(): values.update(table.cmap.keys())
              return values

          for name, latin_path, ext_path in faces:
              subset_font = TTFont(ext_path)
              opts = Options()
              opts.flavor = 'woff2'
              subsetter = Subsetter(options=opts)
              subsetter.populate(unicodes=codepoints)
              subsetter.subset(subset_font)
              subset_font.flavor = 'woff2'
              subset_path = Path('/tmp') / f'czech-{name}'
              subset_font.save(subset_path)

              merged = Merger().merge([str(latin_path), str(subset_path)])
              merged.flavor = 'woff2'
              dest = out / name
              merged.save(dest)
              chars = cmap(dest)
              missing = [ch for ch in target if ord(ch) not in chars]
              basic = [ch for ch in 'AaZz09' if ord(ch) not in chars]
              if missing or basic:
                  raise SystemExit(f'{name}: missing Czech={missing} BasicLatin={basic}')
              print(f'SLIM COMPLETE {name}: {dest.stat().st_size} B; Czech 30/30; BasicLatin 6/6; subset={subset_path.stat().st_size} B')

          css_path = Path('candidate/src/styles/czech-typography.css')
          css = css_path.read_text()
          lines = [line for line in css.splitlines() if not line.lstrip().startswith('@font-face')]
          lines = [line for line in lines if 'Czech Latin Extended faces' not in line]
          css_path.write_text('/* Czech glyphs are embedded in the self-hosted face resources declared by site.css. */\n' + '\n'.join(lines).lstrip() + '\n')
          print('Removed temporary Latin-Extended @font-face declarations from transformed checkout.')
          PY
      - name: Verify transformed complete-face CMAP directly
        run: |
          python <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          target = 'ŘřŮůĚěŠšČčŽžÝýÁáÍíÉéÓóĎďŤťŇň'
          faces = ['inter-400','inter-500','inter-600','cormorant-garamond-400','cormorant-garamond-500','cormorant-garamond-600','cormorant-garamond-400-italic']
          root = Path('candidate/public/assets/fonts')
          for face in faces:
              path = root/f'{face}.woff2'
              font = TTFont(path)
              cmap = set()
              for table in font['cmap'].tables:
                  if table.isUnicode(): cmap.update(table.cmap.keys())
              missing = [ch for ch in target if ord(ch) not in cmap]
              if missing: raise SystemExit(f'{face}: missing {missing}')
              print(f'COMPLETE FACE COVERAGE {face}: PASS {path.stat().st_size} B')
          PY
      - name: Build baseline and transformed candidate
        run: |
          (cd baseline && npm run build:local)
          (cd candidate && npm run build:local)
      - name: Start transformed candidate Worker
        run: |
          (cd candidate && npx -y wrangler@4.128.0 dev --local --port 8789 --inspector-port 9231 > /tmp/candidate-worker.log 2>&1 & echo $! > /tmp/candidate-worker.pid)
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8789/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/candidate-worker.log
          exit 1
      - name: Require duplicate-resource regression GREEN
        env:
          FONT_QA_BASE_URL: http://127.0.0.1:8789
        run: cd candidate && node .github/qa/font-resource-dedup-test.mjs
      - name: Verify rendered font identity and focused typography
        env:
          TYPO_BASE_URL: http://127.0.0.1:8789
        run: cd candidate && node .github/qa/czech-typography-browser-test.mjs | tee slim-browser-font-check.log
      - name: Calibrate actual DOM collision detector
        env:
          TYPO_BASE_URL: http://127.0.0.1:8789
        run: cd candidate && node .github/qa/czech-dom-paint-calibration.mjs
      - name: Run corrected full 88-combination Czech typography audit
        env:
          TYPO_BASE_URL: http://127.0.0.1:8789
        run: cd candidate && node .github/qa/czech-typography-site-audit-v2.mjs
      - name: Run actual DOM 88-combination collision and overlap audit
        env:
          TYPO_BASE_URL: http://127.0.0.1:8789
        run: cd candidate && node .github/qa/czech-typography-geometry-audit.mjs
      - name: Start merge-base Worker for same-run control
        run: |
          (cd baseline && npx -y wrangler@4.128.0 dev --local --port 8788 --inspector-port 9230 > /tmp/baseline-worker.log 2>&1 & echo $! > /tmp/baseline-worker.pid)
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/baseline-worker.log
          exit 1
      - name: Run alternating 3x mobile and 1x desktop Lighthouse control
        run: |
          LH=/tmp/typo-test/node_modules/.bin/lighthouse
          common=(--quiet --output=json --only-categories=performance --chrome-path="$CHROME_PATH" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage")
          for n in 1 2 3; do
            "$LH" http://127.0.0.1:8788/ "${common[@]}" --output-path="baseline-mobile-$n.json"
            "$LH" http://127.0.0.1:8789/ "${common[@]}" --output-path="candidate-mobile-$n.json"
          done
          "$LH" http://127.0.0.1:8788/ "${common[@]}" --preset=desktop --output-path=baseline-desktop.json
          "$LH" http://127.0.0.1:8789/ "${common[@]}" --preset=desktop --output-path=candidate-desktop.json
      - name: Extract slim-delivery performance and network evidence
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          const req = x => ({file:path.basename(new URL(x.url).pathname),url:x.url,transferSize:x.transferSize||0,resourceSize:x.resourceSize||0,resourceType:x.resourceType||null,mimeType:x.mimeType||null,priority:x.priority||null,rendererStartTime:x.rendererStartTime??null,networkRequestTime:x.networkRequestTime??null,networkEndTime:x.networkEndTime??null});
          const read = file => {
            const r=JSON.parse(fs.readFileSync(file)); const all=r.audits['network-requests']?.details?.items||[];
            const fonts=all.filter(x=>x.resourceType==='Font'||/\/assets\/fonts\//.test(x.url)).map(req);
            const images=all.filter(x=>x.resourceType==='Image'||/^image\//.test(x.mimeType||'')).map(req);
            const lcp=r.audits['lcp-breakdown-insight']?.details||r.audits['largest-contentful-paint-element']?.details||null;
            const hero=images.find(x=>/hero-prague-1024\.avif/.test(x.url))||null;
            const jpeg=images.filter(x=>/\.jpe?g(?:[?#]|$)/i.test(x.url));
            return {performance:Math.round(r.categories.performance.score*100),lcpMs:Math.round(r.audits['largest-contentful-paint'].numericValue),fontRequestCount:fonts.length,fontTransferBytes:fonts.reduce((s,x)=>s+x.transferSize,0),totalTransferBytes:all.reduce((s,x)=>s+(x.transferSize||0),0),fonts,heroImage:hero,jpegFallbacks:jpeg,lcpBreakdown:lcp};
          };
          const med=a=>[...a].sort((x,y)=>x-y)[1];
          const bm=[1,2,3].map(n=>read(`baseline-mobile-${n}.json`)); const cm=[1,2,3].map(n=>read(`candidate-mobile-${n}.json`));
          const bd=read('baseline-desktop.json'); const cd=read('candidate-desktop.json');
          const summary={baseline:{mobileRuns:bm.map(x=>({performance:x.performance,lcpMs:x.lcpMs,fontRequestCount:x.fontRequestCount,fontTransferBytes:x.fontTransferBytes,totalTransferBytes:x.totalTransferBytes})),mobileMedian:{performance:med(bm.map(x=>x.performance)),lcpMs:med(bm.map(x=>x.lcpMs))},desktop:{performance:bd.performance,lcpMs:bd.lcpMs,fontRequestCount:bd.fontRequestCount,fontTransferBytes:bd.fontTransferBytes,totalTransferBytes:bd.totalTransferBytes}},candidate:{mobileRuns:cm.map(x=>({performance:x.performance,lcpMs:x.lcpMs,fontRequestCount:x.fontRequestCount,fontTransferBytes:x.fontTransferBytes,totalTransferBytes:x.totalTransferBytes})),mobileMedian:{performance:med(cm.map(x=>x.performance)),lcpMs:med(cm.map(x=>x.lcpMs))},desktop:{performance:cd.performance,lcpMs:cd.lcpMs,fontRequestCount:cd.fontRequestCount,fontTransferBytes:cd.fontTransferBytes,totalTransferBytes:cd.totalTransferBytes}}};
          summary.delta={mobilePerformance:summary.candidate.mobileMedian.performance-summary.baseline.mobileMedian.performance,mobileLcpMs:summary.candidate.mobileMedian.lcpMs-summary.baseline.mobileMedian.lcpMs,desktopPerformance:cd.performance-bd.performance,desktopLcpMs:cd.lcpMs-bd.lcpMs};
          const evidence={summary,baselineMobile:bm,candidateMobile:cm,baselineDesktop:bd,candidateDesktop:cd};
          fs.writeFileSync('slim-font-performance.json',JSON.stringify(evidence,null,2));
          console.log(JSON.stringify(summary,null,2));
          console.log('BASELINE FONTS',JSON.stringify(bm[1].fonts,null,2));
          console.log('SLIM CANDIDATE FONTS',JSON.stringify(cm[1].fonts,null,2));
          console.log('BASELINE HERO/JPEG/LCP',JSON.stringify({hero:bm[1].heroImage,jpeg:bm[1].jpegFallbacks,lcp:bm[1].lcpBreakdown},null,2));
          console.log('SLIM HERO/JPEG/LCP',JSON.stringify({hero:cm[1].heroImage,jpeg:cm[1].jpegFallbacks,lcp:cm[1].lcpBreakdown},null,2));
          EOF
      - name: Upload slim experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slim-czech-complete-face-evidence
          if-no-files-found: warn
          path: |
            candidate/font-resource-dedup.json
            candidate/slim-browser-font-check.log
            candidate/czech-dom-paint-calibration.json
            candidate/czech-typography-site-audit.json
            candidate/czech-typography-geometry-audit.json
            candidate/candidate-screenshots/
            candidate/collision-evidence/
            baseline-mobile-*.json
            candidate-mobile-*.json
            baseline-desktop.json
            candidate-desktop.json
            slim-font-performance.json
            /tmp/baseline-worker.log
            /tmp/candidate-worker.log
