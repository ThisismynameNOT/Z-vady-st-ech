name: Typography Performance Control

on:
  workflow_dispatch:
  push:
    branches: [fix/czech-typography-rendering]

permissions:
  contents: read

jobs:
  combined-font-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout typography candidate
        uses: actions/checkout@v4
        with:
          ref: 00a5017f1234ab652e88eb59631608012763a735
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and verify experimental combined Czech faces
        run: |
          python -m pip install --disable-pip-version-check fonttools brotli
          python <<'PY'
          from fontTools.merge import Merger
          from pathlib import Path

          pairs = [
              ('inter-400.woff2', 'inter-400-latin-ext.woff2'),
              ('inter-500.woff2', 'inter-500-latin-ext.woff2'),
              ('inter-600.woff2', 'inter-600-latin-ext.woff2'),
              ('cormorant-garamond-400.woff2', 'cormorant-garamond-400-latin-ext.woff2'),
              ('cormorant-garamond-500.woff2', 'cormorant-garamond-500-latin-ext.woff2'),
              ('cormorant-garamond-600.woff2', 'cormorant-garamond-600-latin-ext.woff2'),
              ('cormorant-garamond-400-italic.woff2', 'cormorant-garamond-400-italic-latin-ext.woff2'),
          ]
          root = Path('candidate/public/assets/fonts')
          for base_name, ext_name in pairs:
              base = root / base_name
              ext = root / ext_name
              merged = Merger().merge([str(base), str(ext)])
              merged.flavor = 'woff2'
              temp = ext.with_suffix('.merged.woff2')
              merged.save(temp)
              temp.replace(ext)
              print(f'COMBINED {ext.name} {ext.stat().st_size} B')
          PY
          (
            cd candidate
            python .github/qa/czech-font-coverage-test.py
          )
          python <<'PY'
          from fontTools.ttLib import TTFont
          from pathlib import Path

          files = [
              'inter-400-latin-ext.woff2',
              'inter-500-latin-ext.woff2',
              'inter-600-latin-ext.woff2',
              'cormorant-garamond-400-latin-ext.woff2',
              'cormorant-garamond-500-latin-ext.woff2',
              'cormorant-garamond-600-latin-ext.woff2',
              'cormorant-garamond-400-italic-latin-ext.woff2',
          ]
          latin = 'AaZz09'
          czech = 'áčďéěíňóřšťúůýžÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ'
          root = Path('candidate/public/assets/fonts')
          failures = []
          for name in files:
              path = root / name
              font = TTFont(path)
              cmap = set()
              for table in font['cmap'].tables:
                  if table.isUnicode():
                      cmap.update(table.cmap.keys())
              missing_latin = [ch for ch in latin if ord(ch) not in cmap]
              missing_czech = [ch for ch in czech if ord(ch) not in cmap]
              print(f'CMAP {name}: latin={len(latin)-len(missing_latin)}/{len(latin)} czech={len(czech)-len(missing_czech)}/{len(czech)} size={path.stat().st_size} B')
              if missing_latin or missing_czech:
                  failures.append((name, missing_latin, missing_czech))
          if failures:
              for name, latin_missing, czech_missing in failures:
                  print(f'FAIL {name}: missing Latin={latin_missing} Czech={czech_missing}')
              raise SystemExit(1)
          print('COMBINED FONT BASIC LATIN + CZECH CMAP: PASS')
          PY
