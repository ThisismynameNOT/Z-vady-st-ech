name: Landmark Cleanup Validation

on:
  push:
    branches: [qa/landmark-cleanup-validation]

permissions:
  contents: read

jobs:
  semantic-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4ae867f1b9fac8fc1561a9172eecd347cfb48379
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Focused landmark regression RED
        run: node --test tests/landmark-semantics.test.mjs
