name: Landmark Cleanup Validation

on:
  push:
    branches: [qa/landmark-cleanup-validation]

permissions:
  contents: read

jobs:
  semantic-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 65499962163e19221091004b28e44ff9103469a1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Focused landmark regression GREEN
        run: node --test tests/landmark-semantics.test.mjs
