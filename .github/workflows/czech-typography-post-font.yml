name: Czech Typography Post Font Diagnostic

on:
  push:
    branches: [fix/czech-typography-rendering]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-font:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project and focused QA tools
        run: |
          npm ci --no-audit --no-fund
          rm -rf /tmp/typo-test && mkdir -p /tmp/typo-test && cd /tmp/typo-test
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.55.0 pngjs@7.0.0
          ln -s /tmp/typo-test/node_modules "$GITHUB_WORKSPACE/.github/qa/node_modules"
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Build candidate
        run: npm run build:local
      - name: Start production-equivalent local Worker
        run: |
          npx -y wrangler@4.128.0 dev --local --port 8788 > /tmp/wrangler.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wrangler.log
          exit 1
      - name: Repeat Hybernska line-height threshold measurement
        env:
          TYPO_BASE_URL: http://127.0.0.1:8788
        run: node .github/qa/czech-line-height-sweep.mjs
      - name: Upload focused threshold evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: czech-line-height-threshold-repeat
          path: czech-line-height-sweep.json
