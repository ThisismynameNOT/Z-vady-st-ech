name: Czech Typography Post Font Diagnostic

on:
  push:
    branches: [fix/czech-typography-rendering]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-font:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project and QA tools
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check --quiet fonttools brotli
          rm -rf /tmp/typo-test && mkdir -p /tmp/typo-test && cd /tmp/typo-test
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.55.0
          ln -s /tmp/typo-test/node_modules "$GITHUB_WORKSPACE/.github/qa/node_modules"
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Verify combined local Czech coverage
        run: python .github/qa/czech-font-coverage-test.py
      - name: Build candidate
        run: npm run build:local
      - name: Start production-equivalent local Worker
        run: |
          npx -y wrangler@4.128.0 dev --local --port 8788 > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wrangler.log
          exit 1
      - name: Re-measure focused rendered fonts and multiline geometry
        env:
          TYPO_BASE_URL: http://127.0.0.1:8788
        run: node .github/qa/czech-typography-browser-test.mjs
      - name: Run full 88-combination Czech typography audit
        env:
          TYPO_BASE_URL: http://127.0.0.1:8788
        run: node .github/qa/czech-typography-site-audit.mjs
      - name: Upload typography audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: czech-typography-candidate-audit
          if-no-files-found: warn
          path: |
            czech-typography-site-audit.json
            candidate-screenshots/
      - name: Preserve Worker diagnostic state
        if: always()
        run: cat /tmp/wrangler.log | tail -80 || true
