name: Czech Typography Post Font Diagnostic

on:
  push:
    branches: [fix/czech-typography-rendering]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-font:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project and QA tools
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check --quiet fonttools brotli
          rm -rf /tmp/typo-test && mkdir -p /tmp/typo-test && cd /tmp/typo-test
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.55.0 pngjs@7.0.0
          ln -s /tmp/typo-test/node_modules "$GITHUB_WORKSPACE/.github/qa/node_modules"
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Verify combined local Czech coverage
        run: python .github/qa/czech-font-coverage-test.py
      - name: Build candidate
        run: npm run build:local
      - name: Start production-equivalent local Worker
        run: |
          npx -y wrangler@4.128.0 dev --local --port 8788 > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wrangler.log
          exit 1
      - name: Re-measure focused rendered fonts and multiline geometry
        env:
          TYPO_BASE_URL: http://127.0.0.1:8788
        run: node .github/qa/czech-typography-browser-test.mjs
      - name: Sweep selector line-height thresholds
        env:
          TYPO_BASE_URL: http://127.0.0.1:8788
        run: node .github/qa/czech-line-height-sweep.mjs
      - name: Calibrate actual DOM collision detector
        id: calibration
        continue-on-error: true
        env:
          TYPO_BASE_URL: http://127.0.0.1:8788
        run: node .github/qa/czech-dom-paint-calibration.mjs
      - name: Run corrected full 88-combination Czech typography audit
        if: steps.calibration.outcome == 'success'
        id: site
        continue-on-error: true
        env:
          TYPO_BASE_URL: http://127.0.0.1:8788
        run: node .github/qa/czech-typography-site-audit-v2.mjs
      - name: Run actual DOM 88-combination collision and overlap audit
        if: steps.calibration.outcome == 'success'
        id: geometry
        continue-on-error: true
        env:
          TYPO_BASE_URL: http://127.0.0.1:8788
        run: node .github/qa/czech-typography-geometry-audit.mjs
      - name: Upload typography audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: czech-typography-candidate-audit
          if-no-files-found: warn
          path: |
            czech-line-height-sweep.json
            czech-dom-paint-calibration.json
            calibration-negative.png
            calibration-negative-line-*.png
            calibration-negative-overlay.png
            calibration-negative-overlay-line-*.png
            calibration-positive.png
            calibration-positive-line-*.png
            czech-typography-site-audit.json
            czech-typography-geometry-audit.json
            candidate-screenshots/
            collision-evidence/
      - name: Enforce corrected typography gates
        if: always()
        run: |
          echo "calibration=${{ steps.calibration.outcome }}"
          echo "site=${{ steps.site.outcome }}"
          echo "geometry=${{ steps.geometry.outcome }}"
          test "${{ steps.calibration.outcome }}" = success
          test "${{ steps.site.outcome }}" = success
          test "${{ steps.geometry.outcome }}" = success
      - name: Preserve Worker diagnostic state
        if: always()
        run: cat /tmp/wrangler.log | tail -80 || true
