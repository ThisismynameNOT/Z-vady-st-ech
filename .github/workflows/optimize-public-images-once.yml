name: Optimize public images once

on:
  push:
    branches: [perf/optimize-public-images]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/optimize-public-images
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Resize and recompress launch photography
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          targets = {
              'hero-prague.jpg': 1920,
              'national-museum.jpg': 1920,
              'prague-market.jpg': 1920,
              'roof-detail.jpg': 1600,
              'roof-work.jpg': 1600,
          }
          base = Path('public/assets/images')
          for name, max_width in targets.items():
              path = base / name
              with Image.open(path) as source:
                  image = source.convert('RGB')
                  if image.width > max_width:
                      height = round(image.height * max_width / image.width)
                      image = image.resize((max_width, height), Image.Resampling.LANCZOS)
                  image.save(path, 'JPEG', quality=80, optimize=True, progressive=True)
                  print(f'{name}: {image.width}x{image.height} -> {path.stat().st_size} bytes')
          PY
      - name: Commit optimized binaries
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/assets/images/*.jpg
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'perf: optimize public photography'
          git push origin HEAD:perf/optimize-public-images
