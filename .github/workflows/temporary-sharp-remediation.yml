name: One-time Sharp October security remediation
on:
  push:
    branches: [security/sharp-oct-2026]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sharp-security-upgrade
  cancel-in-progress: false
jobs:
  patch-and-verify:
    if: github.ref == 'refs/heads/security/sharp-oct-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Confirm vulnerable baseline (RED)
        run: |
          node - <<'NODE'
          const lock=require('./package-lock.json');
          const items=Object.entries(lock.packages).filter(([p])=> /(^|\/)node_modules\/sharp$/.test(p));
          if(!items.some(([,v])=>/^(0\.(?:[0-2]\.|3[0-4]\.|35\.[0-4]$))/.test(v.version))) {
            throw new Error('Expected outdated sharp baseline not found');
          }
          console.log('Confirmed outdated Sharp instances',items.map(([p,v])=>p+': '+v.version));
          NODE
      - name: Regenerate lockfile with patched Sharp
        run: |
          npm pkg set 'overrides.sharp=^0.35.5'
          npm pkg set 'overrides.dompurify=^3.4.17'
          npm install --save-exact @tinacms/auth@1.1.5 astro@7.4.2 tinacms@3.15.0 wrangler@4.152.0
          npm audit fix --no-fund
      - name: Confirm every Sharp instance patched (GREEN)
        run: |
          node - <<'NODE'
          const lock=require('./package-lock.json');
          const items=Object.entries(lock.packages).filter(([p])=>/(^|\/)node_modules\/sharp$/.test(p));
          if(!items.length) throw Error('No sharp entries in lockfile');
          const outdated=items.filter(([,v])=> {
            const m=v.version.match(/^(\d+)\.(\d+)\.(\d+)/);
            return !m || (+m[1]===0 && (+m[2]<35 || (+m[2]===35 && +m[3]<5)));
          });
          if(outdated.length)throw Error(JSON.stringify(outdated.map(([p,v])=>[p,v.version])));
          console.log('Patched Sharp versions:',items.map(([p,v])=>p+': '+v.version));
          NODE
      - name: Clean install and security audit
        run: |
          npm ci --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Run existing regression tests
        run: |
          npm test
          npm run audit
          npm run typecheck
          npm run build:local
      - name: Commit verified package changes only
        run: |
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): require patched Sharp across dependency tree [skip ci]'
            git push origin HEAD:refs/heads/security/sharp-oct-2026
          fi
