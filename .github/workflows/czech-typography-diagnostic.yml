name: Czech Typography Production Diagnostic

on:
  push:
    branches: [qa/czech-typography-diagnostic]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LIVE_URL: https://zavady-strech-praha.iadamt-93.workers.dev
      EXPECTED_MAIN: 1cc9ca6f89242b3ac31ee4e848ebad1bec1ecf32
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production main baseline
        run: |
          ACTUAL_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "expectedMain=$EXPECTED_MAIN"
          echo "actualMain=$ACTUAL_MAIN"
          test "$ACTUAL_MAIN" = "$EXPECTED_MAIN"

      - name: Inspect WOFF2 Czech CMAP coverage
        run: |
          python -m pip install --disable-pip-version-check --quiet fonttools brotli
          python .github/qa/font-coverage.py

      - name: Install isolated browser tools
        run: |
          rm -rf /tmp/typo-qa
          mkdir -p /tmp/typo-qa
          cd /tmp/typo-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
          cp "$GITHUB_WORKSPACE/.github/qa/czech-typography-diagnostic.mjs" diagnostic.mjs
          ln -s /tmp/typo-qa/node_modules "$GITHUB_WORKSPACE/.github/qa/node_modules"

      - name: Run full live typography diagnostic matrix
        run: |
          node .github/qa/czech-typography-diagnostic.mjs

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: czech-typography-production-diagnostic
          path: |
            font-coverage.json
            czech-typography-diagnostic.json
            screenshots
          if-no-files-found: warn
