name: Czech Typography Validation

on:
  push:
    branches: [fix/czech-typography-rendering]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typography-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TYPO_BASE_URL: https://zavady-strech-praha.iadamt-93.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install font and browser test tools
        run: |
          python -m pip install --disable-pip-version-check --quiet fonttools brotli
          rm -rf /tmp/typo-test && mkdir -p /tmp/typo-test && cd /tmp/typo-test
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.55.0
          ln -s /tmp/typo-test/node_modules "$GITHUB_WORKSPACE/.github/qa/node_modules"
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Czech WOFF2 CMAP coverage
        id: coverage
        continue-on-error: true
        run: python .github/qa/czech-font-coverage-test.py

      - name: Rendered Czech font and multiline geometry
        id: browser
        continue-on-error: true
        run: node .github/qa/czech-typography-browser-test.mjs

      - name: Enforce typography regression gate
        if: always()
        run: |
          echo "coverage=${{ steps.coverage.outcome }}"
          echo "browser=${{ steps.browser.outcome }}"
          test "${{ steps.coverage.outcome }}" = success
          test "${{ steps.browser.outcome }}" = success
