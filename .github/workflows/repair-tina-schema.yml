name: Repair Tina Schema Lock

on:
  push:
    branches: [chore/production-activation-qa]
    paths:
      - .github/workflows/repair-tina-schema.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/production-activation-qa
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Add Workers branch detection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tina/config.ts')
          source = path.read_text()
          old = "const branch=process.env.GITHUB_HEAD_REF || process.env.CF_PAGES_BRANCH || process.env.GITHUB_REF_NAME || 'main';"
          new = "const branch=process.env.GITHUB_HEAD_REF || process.env.WORKERS_CI_BRANCH || process.env.CF_PAGES_BRANCH || process.env.GITHUB_REF_NAME || 'main';"
          if old not in source:
              raise SystemExit('Expected Tina branch resolver was not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Generate Tina schema lock
        shell: bash
        run: |
          set +e
          timeout 45s npx tinacms dev --noWatch
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi
          test -s tina/tina-lock.json

      - name: Commit generated Tina files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tina/config.ts tina/tina-lock.json
          if git diff --cached --quiet; then
            echo "No Tina schema changes to commit."
            exit 0
          fi
          git commit -m "fix: prepare Tina schema for Workers builds"
          git push origin HEAD:chore/production-activation-qa
