name: Homepage LCP Validation

on:
  push:
    branches: [qa/homepage-lcp-validation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homepage-mobile-lcp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Inspect original hero asset
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const file = 'public/assets/images/hero-prague.jpg';
          const buf = fs.readFileSync(file);
          let offset = 2, width = null, height = null;
          while (offset < buf.length) {
            if (buf[offset] !== 0xff) { offset++; continue; }
            const marker = buf[offset + 1];
            if ([0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca,0xcb,0xcd,0xce,0xcf].includes(marker)) {
              height = buf.readUInt16BE(offset + 5);
              width = buf.readUInt16BE(offset + 7);
              break;
            }
            const length = buf.readUInt16BE(offset + 2);
            if (!length) break;
            offset += 2 + length;
          }
          console.log(JSON.stringify({
            file,
            bytes: buf.length,
            width,
            height,
            sha256: crypto.createHash('sha256').update(buf).digest('hex')
          }, null, 2));
          if (!width || !height) process.exit(1);
          NODE
      - name: Install image tooling for QA generation
        run: npm install --no-save --package-lock=false sharp@0.34.3
      - name: Generate same-photo responsive candidates
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');
          const input = 'public/assets/images/hero-prague.jpg';
          const outputDir = 'public/assets/hero';
          const widths = [640, 1024, 1600];
          fs.mkdirSync(outputDir, { recursive: true });
          (async () => {
            for (const width of widths) {
              const height = Math.round(width * 1080 / 1920);
              const base = sharp(input).resize({ width, height, fit: 'fill', kernel: sharp.kernel.lanczos3 });
              await base.clone().avif({ quality: 70, effort: 6 }).toFile(`${outputDir}/hero-prague-${width}.avif`);
              await base.clone().webp({ quality: 82, effort: 5 }).toFile(`${outputDir}/hero-prague-${width}.webp`);
              await base.clone().jpeg({ quality: 82, mozjpeg: true }).toFile(`${outputDir}/hero-prague-${width}.jpg`);
            }
            for (const file of fs.readdirSync(outputDir).sort()) {
              const meta = await sharp(`${outputDir}/${file}`).metadata();
              console.log(JSON.stringify({ file, bytes: fs.statSync(`${outputDir}/${file}`).size, width: meta.width, height: meta.height, format: meta.format }));
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Commit generated delivery assets to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/hero
          if git diff --cached --quiet; then
            echo "Responsive hero assets already committed"
          else
            git commit -m "perf: add responsive hero derivatives"
            git push origin HEAD:fix/homepage-mobile-lcp
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hero-derivatives
          path: public/assets/hero
          if-no-files-found: error
      - name: TDD regression suite
        run: npm test
