name: Homepage Live LCP Verification

on:
  push:
    branches: [qa/homepage-lcp-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_URL: https://zavady-strech-praha.iadamt-93.workers.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe live Worker hero markup
        run: |
          curl -fsSL "$LIVE_URL" -o live-home.html
          echo "responsiveHeroMarkup=$(grep -c '/assets/hero/hero-prague-' live-home.html || true)"
          echo "originalHeroMarkup=$(grep -c '/assets/images/hero-prague.jpg' live-home.html || true)"
      - name: Install QA-only Lighthouse
        run: |
          npm install --no-save --package-lock=false lighthouse@12.8.2
          ./node_modules/.bin/lighthouse --version
      - name: Homepage Lighthouse mobile x3
        run: |
          for run in 1 2 3; do
            ./node_modules/.bin/lighthouse "$LIVE_URL" \
              --output=json \
              --output-path="lh-mobile-${run}.json" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              --quiet
          done
      - name: Homepage Lighthouse desktop x1
        run: |
          ./node_modules/.bin/lighthouse "$LIVE_URL" \
            --preset=desktop \
            --output=json \
            --output-path=lh-desktop.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --quiet
      - name: Summarize live production evidence
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = ['lh-mobile-1.json','lh-mobile-2.json','lh-mobile-3.json','lh-desktop.json'];

          function lcpPhases(report) {
            const audit = report.audits['lcp-breakdown-insight'];
            const table = audit?.details?.items?.find?.((item) => item?.type === 'table');
            const rows = table?.items || [];
            const bySubpart = Object.fromEntries(rows.map((row) => [row.subpart, row.duration]));
            return {
              ttfbMs: bySubpart.timeToFirstByte ?? null,
              resourceLoadDelayMs: bySubpart.resourceLoadDelay ?? null,
              resourceLoadDurationMs: bySubpart.resourceLoadDuration ?? null,
              elementRenderDelayMs: bySubpart.elementRenderDelay ?? null,
              raw: rows,
            };
          }

          const runs = files.map((file) => {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const requests = report.audits['network-requests']?.details?.items || [];
            const responsiveHero = requests.find((item) => /\/assets\/hero\/hero-prague-\d+\.(?:avif|webp|jpg)(?:\?|$)/.test(item.url));
            const originalHero = requests.find((item) => item.url.includes('/assets/images/hero-prague.jpg'));
            const selectedHero = responsiveHero || originalHero || null;
            const match = responsiveHero?.url?.match(/hero-prague-(\d+)\.(avif|webp|jpg)(?:\?|$)/);
            return {
              file,
              mode: file.includes('desktop') ? 'desktop' : 'mobile',
              performance: Math.round((report.categories.performance.score ?? 0) * 100),
              accessibility: Math.round((report.categories.accessibility.score ?? 0) * 100),
              bestPractices: Math.round((report.categories['best-practices'].score ?? 0) * 100),
              seo: Math.round((report.categories.seo.score ?? 0) * 100),
              lcpMs: report.audits['largest-contentful-paint']?.numericValue ?? null,
              selectedHeroUrl: selectedHero?.url ?? null,
              responsiveHeroUrl: responsiveHero?.url ?? null,
              heroFormat: match?.[2] ?? (originalHero ? 'jpg' : null),
              heroCandidateWidth: match ? Number(match[1]) : (originalHero ? 1920 : null),
              heroTransferSize: selectedHero?.transferSize ?? null,
              heroResourceSize: selectedHero?.resourceSize ?? null,
              downloadedOriginalHero: Boolean(originalHero),
              originalHeroTransferSize: originalHero?.transferSize ?? null,
              lcpPhases: lcpPhases(report),
            };
          });

          const mobile = runs.filter((run) => run.mode === 'mobile');
          const sortedLcp = mobile.map((run) => run.lcpMs).sort((a,b) => a-b);
          const summary = {
            liveUrl: process.env.LIVE_URL,
            mobile,
            desktop: runs.find((run) => run.mode === 'desktop'),
            medianMobileLcpMs: sortedLcp[1],
            productionBaselineOriginalHeroBytes: 610933,
          };
          fs.writeFileSync('live-lcp-summary.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));

          for (const run of runs) {
            if (run.accessibility !== 100) throw new Error(`${run.file}: accessibility regressed to ${run.accessibility}`);
            if (run.bestPractices !== 100) throw new Error(`${run.file}: best practices regressed to ${run.bestPractices}`);
            if (run.seo !== 100) throw new Error(`${run.file}: SEO regressed to ${run.seo}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-live-production-lcp-evidence
          path: |
            live-home.html
            lh-mobile-1.json
            lh-mobile-2.json
            lh-mobile-3.json
            lh-desktop.json
            live-lcp-summary.json
          if-no-files-found: error
