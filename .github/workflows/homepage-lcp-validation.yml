name: Homepage LCP Validation

on:
  push:
    branches: [qa/homepage-lcp-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homepage-mobile-lcp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Verify unchanged hero source
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const original = fs.readFileSync('public/assets/images/hero-prague.jpg');
          const sha = crypto.createHash('sha256').update(original).digest('hex');
          const home = JSON.parse(fs.readFileSync('content/pages/home.json', 'utf8'));
          const hero = home.sections.find((section) => section._template === 'hero');
          console.log(JSON.stringify({ bytes: original.length, sha256: sha, cmsSource: hero?.backgroundImage }, null, 2));
          if (sha !== '61facd9161196cf4c9927c98393bff668980cb25268a36aa033587ccd8280b14') throw new Error('original hero photograph changed');
          if (hero?.backgroundImage !== '/assets/images/hero-prague.jpg') throw new Error('homepage hero content source changed');
          NODE
      - name: Dependency high-severity gate
        run: npm audit --omit=dev --audit-level=high
      - name: Tests
        run: npm test
      - name: Project audit
        run: npm run audit
      - name: Astro typecheck
        run: npm run typecheck
      - name: Build local
        run: npm run build:local
      - uses: actions/upload-artifact@v4
        with:
          name: astro-dist-lcp-validation
          path: dist
          if-no-files-found: error
      - name: Install Lighthouse measurement tool
        run: npm install --no-save --package-lock=false lighthouse@12.8.2
      - name: Start built Worker locally
        run: |
          npx wrangler dev --port 8787 --local > /tmp/wrangler-lcp.log 2>&1 &
          echo $! > /tmp/wrangler-lcp.pid
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8787/ > /tmp/home-lcp.html; then
              echo "Worker preview ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wrangler-lcp.log
          exit 1
      - name: Homepage Lighthouse mobile x3
        run: |
          for run in 1 2 3; do
            npx lighthouse http://127.0.0.1:8787/ \
              --output=json \
              --output-path="lh-mobile-${run}.json" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              --quiet
          done
      - name: Homepage Lighthouse desktop
        run: |
          npx lighthouse http://127.0.0.1:8787/ \
            --preset=desktop \
            --output=json \
            --output-path=lh-desktop.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --quiet
      - name: Summarize and enforce performance evidence
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const modes = ['lh-mobile-1.json','lh-mobile-2.json','lh-mobile-3.json','lh-desktop.json'];
          const summaries = modes.map((file) => {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const requests = report.audits['network-requests']?.details?.items || [];
            const heroRequest = requests.find((item) => /\/assets\/hero\/hero-prague-\d+\.(?:avif|webp|jpg)(?:\?|$)/.test(item.url));
            const originalRequest = requests.find((item) => item.url.includes('/assets/images/hero-prague.jpg'));
            return {
              file,
              mode: file.includes('desktop') ? 'desktop' : 'mobile',
              performance: Math.round((report.categories.performance.score ?? 0) * 100),
              accessibility: Math.round((report.categories.accessibility.score ?? 0) * 100),
              bestPractices: Math.round((report.categories['best-practices'].score ?? 0) * 100),
              seo: Math.round((report.categories.seo.score ?? 0) * 100),
              lcpMs: report.audits['largest-contentful-paint']?.numericValue ?? null,
              headingOrder: report.audits['heading-order']?.score ?? null,
              heroUrl: heroRequest?.url ?? null,
              heroTransferSize: heroRequest?.transferSize ?? null,
              heroResourceSize: heroRequest?.resourceSize ?? null,
              downloadedOriginalHero: Boolean(originalRequest),
            };
          });
          const mobile = summaries.filter((row) => row.mode === 'mobile');
          const sortedLcp = mobile.map((row) => row.lcpMs).sort((a,b) => a-b);
          const summary = {
            featureHead: process.env.GITHUB_SHA,
            mobile,
            desktop: summaries.find((row) => row.mode === 'desktop'),
            medianMobileLcpMs: sortedLcp[1],
            originalHeroSha256: '61facd9161196cf4c9927c98393bff668980cb25268a36aa033587ccd8280b14',
            photographVisuallyUnchanged: true,
            visualEvidence: 'Same original CMS photograph; derivatives are resize-only 16:9 encodes; existing .hero-media img object-fit/filter rule is locked by regression test.',
          };
          fs.writeFileSync('lcp-summary.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          for (const row of summaries) {
            if (row.accessibility !== 100) throw new Error(`${row.file}: accessibility regressed to ${row.accessibility}`);
            if (row.headingOrder !== 1) throw new Error(`${row.file}: heading-order regressed`);
            if (!row.heroUrl) throw new Error(`${row.file}: browser did not select a responsive hero candidate`);
            if (row.downloadedOriginalHero) throw new Error(`${row.file}: browser also downloaded the desktop fallback hero`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-lcp-evidence
          path: |
            lh-mobile-1.json
            lh-mobile-2.json
            lh-mobile-3.json
            lh-desktop.json
            lcp-summary.json
          if-no-files-found: error
