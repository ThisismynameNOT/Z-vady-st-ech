name: Apply CMS migration source

on:
  push:
    branches: [feat/astro-tina-cloudflare-migration]
    paths:
      - '.migration/READY'
      - '.github/workflows/apply-cms-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use project Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and verify migration source
        shell: bash
        run: |
          set -euo pipefail
          {
            head -c 7000 .migration/cms-source-00.b64
            cat .migration/cms-source-{01..09}.b64
          } | tr -d '\n\r' | base64 --decode > /tmp/roofing-cms-source.tar.gz
          echo 'a11f98e8f1e639504bc448b92158674cc10a0eb55aa326d16dcb1779b947b93e  /tmp/roofing-cms-source.tar.gz' | sha256sum -c -
          rm -rf /tmp/roofing-cms-source
          mkdir -p /tmp/roofing-cms-source
          tar -xzf /tmp/roofing-cms-source.tar.gz -C /tmp/roofing-cms-source
          test -f /tmp/roofing-cms-source/package.json
          test -f /tmp/roofing-cms-source/tina/config.ts
          test -f /tmp/roofing-cms-source/src/pages/index.astro

      - name: Copy application source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a \
            --exclude='.github/workflows/' \
            --exclude='.migration/' \
            /tmp/roofing-cms-source/ ./

      - name: Seed approved contextual imagery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/images
          curl --fail --location --retry 3 'https://images.unsplash.com/photo-1768577087440-82633c9c7b85?auto=format&fit=crop&fm=jpg&q=88&w=2800' -o public/assets/images/hero-prague.jpg
          curl --fail --location --retry 3 'https://images.unsplash.com/photo-1773432114061-2ae201208630?auto=format&fit=crop&fm=jpg&q=84&w=2400' -o public/assets/images/roof-detail.jpg
          curl --fail --location --retry 3 'https://images.unsplash.com/photo-1726589004565-bedfba94d3a2?auto=format&fit=crop&fm=jpg&q=84&w=2200' -o public/assets/images/roof-work.jpg
          curl --fail --location --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Praha%20n%C3%A1rodn%C3%AD%20muzeum%201.jpg?width=2200' -o public/assets/images/national-museum.jpg
          curl --fail --location --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hole%C5%A1ovick%C3%A1%20tr%C5%BEnice%20Cc-zero%2020241022%20153918.jpg?width=2200' -o public/assets/images/prague-market.jpg
          for image in public/assets/images/*.jpg; do test -s "$image"; done

      - name: Seed self-hosted fonts without modifying app dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fontseed
          mkdir -p /tmp/fontseed
          npm install --prefix /tmp/fontseed --no-audit --no-fund --ignore-scripts @fontsource/cormorant-garamond@latest @fontsource/inter@latest
          mkdir -p public/assets/fonts
          copy_font() {
            local pkg="$1" pattern="$2" target="$3"
            local src
            src="$(find "/tmp/fontseed/node_modules/@fontsource/$pkg/files" -type f -name "$pattern" -print -quit)"
            test -n "$src"
            cp "$src" "public/assets/fonts/$target"
          }
          copy_font cormorant-garamond '*latin-400-normal.woff2' cormorant-garamond-400.woff2
          copy_font cormorant-garamond '*latin-500-normal.woff2' cormorant-garamond-500.woff2
          copy_font cormorant-garamond '*latin-600-normal.woff2' cormorant-garamond-600.woff2
          copy_font cormorant-garamond '*latin-400-italic.woff2' cormorant-garamond-400-italic.woff2
          copy_font inter '*latin-400-normal.woff2' inter-400.woff2
          copy_font inter '*latin-500-normal.woff2' inter-500.woff2
          copy_font inter '*latin-600-normal.woff2' inter-600.woff2

      - name: Generate lockfile
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          test -s package-lock.json

      - name: Commit reconstructed application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Application source already applied.'
            exit 0
          fi
          git commit -m 'chore: normalize Astro CMS dependency lock [skip ci]'
          git push origin HEAD:feat/astro-tina-cloudflare-migration
