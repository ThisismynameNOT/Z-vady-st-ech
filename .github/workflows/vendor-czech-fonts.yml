name: Vendor Czech Complete Font Faces

on:
  push:
    branches: [fix/czech-typography-rendering]

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/czech-typography-rendering
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned maintenance inputs
        run: |
          python -m pip install --disable-pip-version-check --quiet fonttools==4.64.0 brotli==1.2.0
          rm -rf /tmp/fontsource && mkdir -p /tmp/fontsource && cd /tmp/fontsource
          npm init -y >/dev/null
          npm install --no-audit --no-fund @fontsource/inter@5.3.0 @fontsource/cormorant-garamond@5.3.0
      - name: Generate canonical Latin plus Czech faces
        env:
          FONTSOURCE_NODE_MODULES: /tmp/fontsource/node_modules
        run: |
          python scripts/build-czech-fonts.py
          ls -lh public/assets/fonts/inter-*.woff2 public/assets/fonts/cormorant-garamond-*.woff2
      - name: Remove obsolete dual-resource delivery and update permanent metadata/tests
        run: |
          git rm -f public/assets/fonts/*-latin-ext.woff2
          cat > src/styles/czech-typography.css <<'EOF'
          /* Czech glyphs are embedded in the canonical self-hosted faces declared by site.css. */

          /* Measured multiline display fixes: keep the editorial scale, remove line-box collisions. */
          .hero h1,.subhero h1,.split-head .h2{line-height:1}
          .final-cta h2{line-height:1.01}
          .service-detail h2{line-height:1.08}
          .case h2{line-height:1}
          .contact-aside h2{line-height:1.01}
          .story-copy h2{line-height:.98}
          EOF
          cat > public/assets/fonts/PROVENANCE.md <<'EOF'
          # Self-hosted font provenance

          The public site serves seven Czech-complete WOFF2 application faces locally. There is no runtime Google Fonts, Fontsource, npm, or CDN dependency.

          Source packages and licenses:

          - `@fontsource/inter@5.3.0` — Inter upstream font version v4.1 — SIL Open Font License 1.1.
          - `@fontsource/cormorant-garamond@5.3.0` — Cormorant Garamond upstream font version v21 — SIL Open Font License 1.1.

          Generated application faces:

          - `inter-400.woff2`
          - `inter-500.woff2`
          - `inter-600.woff2`
          - `cormorant-garamond-400.woff2`
          - `cormorant-garamond-500.woff2`
          - `cormorant-garamond-600.woff2`
          - `cormorant-garamond-400-italic.woff2`

          Generation method: for each face, `scripts/build-czech-fonts.py` takes the Fontsource 5.3.0 `latin` WOFF2 face, takes the matching same-version `latin-ext` WOFF2 face, subsets `latin-ext` to the exact Czech target set below, and merges that subset into the Latin face. The result is written to the existing canonical application URL. The maintenance pipeline is pinned to FontTools 4.64.0 and Brotli 1.2.0; generation is a maintenance/build operation only and never occurs at runtime.

          Czech target glyph set (28 characters):

          `ŘřŮůĚěŠšČčŽžÝýÁáÍíÉéÓóĎďŤťŇň`

          The obsolete separate `*-latin-ext.woff2` resources are intentionally not shipped, preventing duplicate downloads for one family + weight + style on pages containing both Czech and ordinary Latin text.
          EOF
          cat > tests/czech-typography-assets.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const css = fs.readFileSync('src/styles/czech-typography.css', 'utf8');
          const siteCss = fs.readFileSync('src/styles/site.css', 'utf8');
          const layout = fs.readFileSync('src/layouts/BaseLayout.astro', 'utf8');
          const provenance = fs.readFileSync('public/assets/fonts/PROVENANCE.md', 'utf8');

          const assets = [
            'inter-400.woff2',
            'inter-500.woff2',
            'inter-600.woff2',
            'cormorant-garamond-400.woff2',
            'cormorant-garamond-500.woff2',
            'cormorant-garamond-600.woff2',
            'cormorant-garamond-400-italic.woff2',
          ];

          test('canonical application faces are local Czech-complete resources with no legacy dual-resource CSS', () => {
            assert.match(layout, /import ['"]\.\.\/styles\/czech-typography\.css['"]/);
            for (const asset of assets) {
              const path = `public/assets/fonts/${asset}`;
              assert.ok(fs.existsSync(path), `${path} must exist`);
              assert.ok(fs.statSync(path).size > 20_000, `${path} must contain a real WOFF2 payload`);
              assert.ok(siteCss.includes(`/assets/fonts/${asset}`), `${asset} must remain declared by the canonical @font-face`);
            }
            assert.equal(fs.readdirSync('public/assets/fonts').filter(name => name.endsWith('-latin-ext.woff2')).length, 0);
            assert.doesNotMatch(css, /@font-face/);
            assert.doesNotMatch(css, /latin-ext\.woff2/);
            assert.match(provenance, /Fontsource 5\.3\.0/);
            assert.match(provenance, /FontTools 4\.64\.0/);
            assert.match(provenance, /There is no runtime Google Fonts, Fontsource, npm, or CDN dependency/);
          });

          test('measured Czech display collisions keep the proven selector line heights', () => {
            assert.match(css, /\.hero h1,\.subhero h1,\.split-head \.h2\{line-height:1\}/);
            assert.match(css, /\.final-cta h2\{line-height:1\.01\}/);
            assert.match(css, /\.service-detail h2\{line-height:1\.08\}/);
            assert.match(css, /\.case h2\{line-height:1\}/);
            assert.match(css, /\.contact-aside h2\{line-height:1\.01\}/);
            assert.match(css, /\.story-copy h2\{line-height:\.98\}/);
          });
          EOF
          cat > .github/qa/czech-font-coverage-test.py <<'EOF'
          from pathlib import Path
          from fontTools.ttLib import TTFont

          TARGET = "ŘřŮůĚěŠšČčŽžÝýÁáÍíÉéÓóĎďŤťŇň"
          BASIC_LATIN = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"
          FACES = [
              "inter-400", "inter-500", "inter-600",
              "cormorant-garamond-400", "cormorant-garamond-500",
              "cormorant-garamond-600", "cormorant-garamond-400-italic",
          ]
          FONT_DIR = Path("public/assets/fonts")

          failures = []
          legacy = sorted(FONT_DIR.glob("*-latin-ext.woff2"))
          if legacy:
              failures.append("obsolete Latin-Extended resources still present: " + ", ".join(p.name for p in legacy))

          for face in FACES:
              path = FONT_DIR / f"{face}.woff2"
              if not path.is_file():
                  failures.append(f"missing canonical font asset: {path.name}")
                  continue
              font = TTFont(path)
              cmap = set()
              for table in font["cmap"].tables:
                  if table.isUnicode():
                      cmap.update(table.cmap.keys())
              missing_czech = [ch for ch in TARGET if ord(ch) not in cmap]
              missing_latin = [ch for ch in BASIC_LATIN if ord(ch) not in cmap]
              if missing_czech or missing_latin:
                  failures.append(
                      f"{face}: missing Czech={' '.join(missing_czech) or 'none'}; "
                      f"BasicLatin={' '.join(missing_latin) or 'none'}"
                  )

          if failures:
              print("CZECH FONT COVERAGE: FAIL")
              for failure in failures:
                  print(f"- {failure}")
              raise SystemExit(1)

          print(f"CZECH FONT COVERAGE: PASS — {len(FACES)} canonical faces; Czech {len(TARGET)}/{len(TARGET)} per face; legacy ext resources 0")
          EOF
      - name: Commit permanent self-hosted font delivery
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build-czech-fonts.py src/styles/czech-typography.css public/assets/fonts tests/czech-typography-assets.test.mjs .github/qa/czech-font-coverage-test.py
          if git diff --cached --quiet; then
            echo 'No permanent font changes to commit.'
            exit 0
          fi
          git commit -m 'fix: embed Czech glyphs in canonical font faces'
          git push origin HEAD:fix/czech-typography-rendering
