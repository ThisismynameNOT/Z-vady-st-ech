name: Live Production Color Contrast Acceptance

on:
  push:
    branches: [qa/color-contrast-validation]

permissions:
  contents: read

jobs:
  live-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/color-contrast-validation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install QA-only browser tools
        run: |
          mkdir -p /tmp/live-qa
          cp .github/qa/color-contrast-live-production.mjs /tmp/live-qa/
          cd /tmp/live-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.55.0 axe-core@4.10.2
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Probe live production Worker
        env:
          LIVE_URL: https://zavady-strech-praha.iadamt-93.workers.dev
        run: |
          curl -fsS -o /tmp/live-home.html -w 'HTTP %{http_code}\n' "$LIVE_URL/"
          test -s /tmp/live-home.html
      - name: Full 11-route x 8-viewport axe matrix and reveal-motion checks
        env:
          LIVE_URL: https://zavady-strech-praha.iadamt-93.workers.dev
        run: |
          cd /tmp/live-qa
          node color-contrast-live-production.mjs
          cp color-contrast-live-production.json "$GITHUB_WORKSPACE/"
          cp reveal-normal-50ms.png "$GITHUB_WORKSPACE/"
          cp reveal-normal-350ms.png "$GITHUB_WORKSPACE/"
          cp reveal-normal-end.png "$GITHUB_WORKSPACE/"
          cp reveal-reduced-motion.png "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: color-contrast-live-production-evidence
          path: |
            color-contrast-live-production.json
            reveal-normal-50ms.png
            reveal-normal-350ms.png
            reveal-normal-end.png
            reveal-reduced-motion.png
          if-no-files-found: warn
