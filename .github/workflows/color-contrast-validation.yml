name: Color Contrast Feature Validation

on:
  push:
    branches: [qa/color-contrast-validation]

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 72fd2c23dea3a7be12b7c71b1f931f87cd0496a4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run focused color contrast regression test
        run: node --test tests/color-contrast-reveal.test.mjs
