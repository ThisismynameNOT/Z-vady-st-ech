name: Final Public Acceptance

on:
  push:
    branches: [fix/czech-typography-rendering]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project
        run: npm ci --no-audit --no-fund
      - name: Run unit tests
        run: |
          set -o pipefail
          npm test | tee npm-test.log
      - name: Run project audit
        run: |
          set -o pipefail
          npm run audit | tee project-audit.log
      - name: Run Astro typecheck
        run: |
          set -o pipefail
          npm run typecheck | tee typecheck.log
      - name: High severity dependency gate
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > dependency-audit.json
          rc=$?
          set -e
          node -e "const r=require('./dependency-audit.json');console.log(JSON.stringify(r.metadata?.vulnerabilities||{},null,2))"
          test "$rc" -eq 0
      - name: Build production-equivalent candidate
        run: |
          set -o pipefail
          npm run build:local | tee build-local.log
      - name: Install browser QA tools
        run: |
          rm -rf /tmp/final-qa && mkdir -p /tmp/final-qa && cd /tmp/final-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright-core@1.55.0 axe-core@4.10.3 lighthouse@12.8.2
          ln -s /tmp/final-qa/node_modules "$GITHUB_WORKSPACE/.github/qa/node_modules"
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start production-equivalent local Worker
        run: |
          npx -y wrangler@4.128.0 dev --local --port 8788 > /tmp/wrangler-final.log 2>&1 &
          echo $! > /tmp/wrangler-final.pid
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8788/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wrangler-final.log
          exit 1
      - name: Run full public acceptance and axe matrix
        env:
          QA_BASE_URL: http://127.0.0.1:8788
        run: node .github/qa/final-public-acceptance.mjs
      - name: Lighthouse mobile
        run: /tmp/final-qa/node_modules/.bin/lighthouse http://127.0.0.1:8788/ --quiet --output=json --output-path=lighthouse-mobile.json --only-categories=performance,accessibility,best-practices,seo --chrome-path="$CHROME_PATH" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
      - name: Lighthouse desktop
        run: /tmp/final-qa/node_modules/.bin/lighthouse http://127.0.0.1:8788/ --quiet --preset=desktop --output=json --output-path=lighthouse-desktop.json --only-categories=performance,accessibility,best-practices,seo --chrome-path="$CHROME_PATH" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
      - name: Report and enforce Lighthouse quality gates
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const pick=p=>{const r=JSON.parse(fs.readFileSync(p));return {performance:Math.round(r.categories.performance.score*100),lcpMs:Math.round(r.audits['largest-contentful-paint'].numericValue),accessibility:Math.round(r.categories.accessibility.score*100),bestPractices:Math.round(r.categories['best-practices'].score*100),seo:Math.round(r.categories.seo.score*100)}};
          const out={mobile:pick('lighthouse-mobile.json'),desktop:pick('lighthouse-desktop.json')};
          fs.writeFileSync('lighthouse-summary.json',JSON.stringify(out,null,2)); console.log(JSON.stringify(out,null,2));
          for(const x of Object.values(out)) if(x.accessibility!==100||x.bestPractices!==100||x.seo!==100) process.exit(1);
          EOF
      - name: Upload final acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-public-acceptance-evidence
          if-no-files-found: warn
          path: |
            npm-test.log
            project-audit.log
            typecheck.log
            build-local.log
            dependency-audit.json
            final-public-acceptance.json
            lighthouse-mobile.json
            lighthouse-desktop.json
            lighthouse-summary.json
      - name: Preserve Worker log
        if: always()
        run: tail -100 /tmp/wrangler-final.log || true
