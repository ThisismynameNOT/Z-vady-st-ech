name: Brand Accessible Name RED

on:
  push:
    branches: [fix/brand-accessible-name]

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/brand-accessible-name.test.mjs
